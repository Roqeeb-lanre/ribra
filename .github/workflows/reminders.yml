name: Daily reminders

# Every day at 07:00 Lagos time (06:00 UTC), ask the API to email today's and tomorrow's next steps.
# GitHub may start scheduled runs a few minutes late; that's fine for reminders.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in the repository secrets." && exit 1
          fi
          # Render's free plan sleeps, so the first try can time out while it wakes up.
          curl --fail-with-body --silent --show-error \
            --retry 4 --retry-delay 30 --retry-all-errors --max-time 120 \
            -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            https://ribra-api.onrender.com/api/v1/internal/reminders
